<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up - Creativity</title>
<style>/* same CSS as login.html */</style>
</head>
<body>
  <div class="tabs">
    <div class="tab active">Sign up</div>
    <div class="tab" onclick="window.location.href='login.html'">Login</div>
  </div>

  <div class="side">
    <p>Create your designs<br>using a 3D model<br>according to your taste</p>
  </div>

  <div class="main">
    <div class="avatar"></div>
    <h2>Create an Account</h2>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <input type="text" placeholder="First Name">
      <input type="text" placeholder="Last Name">
    </div>
    <input type="email" placeholder="Email Address">
    <input type="password" placeholder="Password">
    <button class="btn" onclick="window.location.href='get-started.html'">Create</button>

    <p style="margin-top:20px;color:#A0A0A0;font-size:0.9rem">Or use</p>
    <div class="social">
      <button class="social-btn">Google</button>
      <button class="social-btn">Facebook</button>
      <button class="social-btn">Apple</button>
      <button class="social-btn">Instagram</button>
    </div>
  </div>
</body>
</html>
