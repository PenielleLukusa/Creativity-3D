<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Creativity 3D</title>
  <link rel="stylesheet" href="style.css"> <!-- CSS CONNECTED -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCQF_gA_isYuLQWE8zTFuKKhMuDGO3Epcg",
      authDomain: "creativity-3d.firebaseapp.com",
      projectId: "creativity-3d",
      storageBucket: "creativity-3d.firebasestorage.app",
      messagingSenderId: "489202381387",
      appId: "1:489202381387:web:f9f89c85c53fba83f8d3ce"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    document.addEventListener('DOMContentLoaded', () => {
      const form = document.querySelector('.auth-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const name = document.getElementById('name').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        try {
          await createUserWithEmailAndPassword(auth, email, password);
          alert("Account Created Successfully!");
          window.location.href = "home.html"; // goes to landing page
        } catch (error) {
          alert("Error: " + error.message);
        }
      });
    });
  </script>
</head>
<body>
  <div class="auth-container">
    <h2>Create Your Account</h2>
    <form class="auth-form">
      <input type="text" id="name" placeholder="Full Name" required>
      <input type="email" id="email" placeholder="Email" required>
      <input type="password" id="password" placeholder="Password" required>
      <button type="submit" class="btn-primary">Create</button>
    </form>
    <p>Already have an account? <a href="login.html">Login</a></p>
  </div>
</body>
</html>
