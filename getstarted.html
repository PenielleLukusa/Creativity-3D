<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#E8E8E8;color:#0F0F0F}
 .container{max-width:1100px;margin:30px auto;padding:30px;border-radius:12px}
  h1{font-size:1.1rem;margin-bottom:20px;font-weight:500}
  h2{text-align:center;margin:15px 0;font-weight:500;font-size:1.3rem}
 .model-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;margin-bottom:30px}
 .model-card{background:#D0D0D0;border-radius:8px;padding:15px;text-align:center}
 .model-preview{width:100%;height:280px;background:#B0B0B0;border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600}
 .model-card button{background:#0F0F0F;color:#E5E5;border:none;padding:8px 20px;border-radius:4px;margin-top:10px;cursor:pointer;font-size:0.9rem;width:100%}
 .customize-link{text-align:center;margin-top:20px}
 .customize-link button{background:transparent;border:1px solid #0F0F0F;color:#0F0F0F;padding:8px 20px;border-radius:4px;cursor:pointer;font-size:0.9rem}
 .customize-wrapper{display:none}
 .back-btn{background:#333;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer;margin-bottom:15px}
</style>
</head>
<body>
  <div class="container" id="choosePage">
    <h1>Get started</h1>
    <h2>Choose your model</h2>
    <div class="model-grid">
      <div class="model-card">
        <div class="model-preview">MANNEQUIN 1</div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
      <div class="model-card">
        <div class="model-preview">MANNEQUIN 2</div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
      <div class="model-card">
        <div class="model-preview">MANNEQUIN 3</div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
    </div>
    <div class="customize-link">
      <button onclick="document.getElementById('choosePage').style.display='none';document.getElementById('customizePage').style.display='block'">Customize Your Own Model</button>
    </div>
  </div>

  <div class="container customize-wrapper" id="customizePage">
    <button class="back-btn" onclick="document.getElementById('choosePage').style.display='block';document.getElementById('customizePage').style.display='none'">‹ Back</button>
    <h2>Customize your own model</h2>
    <div style="background:#D0D0D0;padding:20px;border-radius:8px;text-align:center;margin-top:20px">
      <p>Measurements Form Here</p>
      <button style="background:#0F0F0F;color:#fff;padding:10px 30px;border:none;border-radius:6px;margin-top:15px;cursor:pointer" onclick="window.location.href='workspace.html'">Create</button>
    </div>
  </div>
</body>
</html>
