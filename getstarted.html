<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{
    background:#0F0F0F;
    color:#F5F5F5;
    background-image:repeating-linear-gradient(90deg,#DDB89210 0 1px,transparent 1px 20px)
  }
 .nav{display:flex;gap:10px;background:#1A1A1A;padding:8px 20px;border-radius:30px;width:fit-content;margin:15px auto}
 .nav button{background:transparent;border:none;color:#A0A0A0;padding:8px 20px;border-radius:20px;cursor:pointer;font-size:0.9rem}
 .nav button.active{background:#DDB892;color:#0F0F0F;font-weight:600}
 
 .container{background:#1A1A1A;color:#F5F5F5;max-width:1100px;margin:30px auto;padding:30px;border-radius:12px;border:1px solid #2a2a2a}
  h1{font-size:1.2rem;margin-bottom:20px;font-weight:500;color:#DDB892}
  h2{text-align:center;margin:15px 0;font-weight:500;font-size:1.3rem;color:#F5F5F5}
 .model-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:20px;margin-bottom:30px}
 .model-card{background:#2a2a2a;border-radius:8px;padding:15px;text-align:center;border:2px solid transparent;transition:0.3s;cursor:pointer}
 .model-card:hover{border-color:#DDB892}
 .model-preview{width:100%;height:280px;background:linear-gradient(135deg, #3a3a3a 0%, #222 100%);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:1rem;color:#DDB892;overflow:hidden}
 .model-preview img{width:100%;height:100%;object-fit:cover}
 .model-card button{background:#DDB892;color:#0F0F0F;border:none;padding:10px 20px;border-radius:6px;margin-top:12px;cursor:pointer;font-size:0.9rem;width:100%;font-weight:600}
 .model-card button:hover{background:#E8DCCA}
 .customize-link{text-align:center;margin-top:20px}
 .customize-link button{background:transparent;border:1px solid #DDB892;color:#DDB892;padding:10px 24px;border-radius:6px;cursor:pointer;font-size:0.9rem}
 .customize-link button:hover{background:#DDB892;color:#0F0F0F}
 .customize-wrapper{display:none}
 .back-btn{background:#2a2a2a;color:#DDB892;border:1px solid #DDB892;padding:6px 12px;border-radius:4px;cursor:pointer;margin-bottom:15px}
 .back-btn:hover{background:#DDB892;color:#0F0F0F}
</style>
</head>
<body>
  <div class="nav">
    <button class="active" onclick="window.location.href='home.html'">Home</button>
    <button>Explore</button>
    <button>Gallery</button>
    <button>Marketplace</button>
  </div>

  <div class="container" id="choosePage">
    <h1>Get started</h1>
    <h2>Choose your model</h2>
    <div class="model-grid">
      <div class="model-card">
        <div class="model-preview">
          <img src="https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?w=400&h=280&fit=crop" alt="Female Model">
        </div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
      <div class="model-card">
        <div class="model-preview">
          <img src="https://images.unsplash.com/photo-1539109136881-3be0616acf4b?w=400&h=280&fit=crop" alt="Female Model 2">
        </div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
      <div class="model-card">
        <div class="model-preview">
          <img src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400&h=280&fit=crop" alt="Female Model 3">
        </div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
    </div>
    <div class="customize-link">
      <button onclick="document.getElementById('choosePage').style.display='none';document.getElementById('customizePage').style.display='block'">Customize Your Own Model</button>
    </div>
  </div>

  <div class="container customize-wrapper" id="customizePage">
    <button class="back-btn" onclick="document.getElementById('choosePage').style.display='block';document.getElementById('customizePage').style.display='none'">‹ Back</button>
    <h2>Customize your own model</h2>
    <div style="background:#2a2a2a;padding:20px;border-radius:8px;text-align:center;margin-top:20px">
      <p style="color:#A0A0A0">Add measurements here</p>
      <button style="background:#DDB892;color:#0F0F0F;padding:12px 30px;border:none;border-radius:6px;margin-top:15px;cursor:pointer;font-weight:600" onclick="window.location.href='workspace.html'">Create</button>
    </div>
  </div>
</body>
</html>
