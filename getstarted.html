<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{
    background:#0F0F0F;
    color:#F5F5F5;
    background-image:repeating-linear-gradient(90deg,#DDB89210 0 1px,transparent 1px 20px);
    min-height:100vh
  }
 .nav{display:flex;gap:10px;background:#1A1A1A;padding:8px 20px;border-radius:30px;width:fit-content;margin:15px auto}
 .nav button{background:transparent;border:none;color:#A0A0A0;padding:8px 20px;border-radius:20px;cursor:pointer;font-size:0.9rem}
 .nav button.active{background:#DDB892;color:#0F0F0F;font-weight:600}
 
 .container{background:#DDB892;color:#0F0F0F;max-width:1200px;margin:30px auto;padding:40px;border-radius:16px;box-shadow:0 8px 30px rgba(221,184,146,0.3)}
  h1{font-size:1.3rem;margin-bottom:20px;font-weight:600}
  h2{text-align:center;margin:10px 0 30px;font-weight:600;font-size:1.5rem}
 
 .model-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:30px;margin-bottom:30px}
 .model-card{background:#0F0F0F;border-radius:12px;padding:20px;text-align:center;transition:0.3s}
 .model-card:hover{border:2px solid #DDB892;transform:translateY(-5px)}
 .model-preview{width:100%;height:340px;background:#111;border-radius:10px;overflow:hidden}
 .model-card button{background:#DDB892;color:#0F0F0F;border:none;padding:12px 20px;border-radius:8px;margin-top:15px;cursor:pointer;font-size:1rem;width:100%;font-weight:700}
 .customize-link{text-align:center;margin-top:25px}
 .customize-link button{background:#0F0F0F;border:none;color:#DDB892;padding:12px 28px;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:600}
 @media(max-width:1000px){.model-grid{grid-template-columns:1fr;gap:20px}}
</style>

<!-- Three.js for loading GLTF -->
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div class="nav">
    <button class="active" onclick="window.location.href='home.html'">Home</button>
    <button>Explore</button>
    <button>Gallery</button>
    <button>Marketplace</button>
  </div>

  <div class="container" id="choosePage">
    <h1>Get started</h1>
    <h2>Choose your model</h2>
    <div class="model-grid">
      <div class="model-card">
        <div class="model-preview" id="canvas1"></div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
      <div class="model-card">
        <div class="model-preview" id="canvas2"></div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
      <div class="model-card">
        <div class="model-preview" id="canvas3"></div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
    </div>
    <div class="customize-link">
      <button onclick="alert('Customize coming soon')">Customize Your Own Model</button>
    </div>
  </div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

function loadMannequin(containerId){
  const container = document.getElementById(containerId);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);
  
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xDDB892, 1));
  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(2,3,5);
  scene.add(light);

  const loader = new GLTFLoader();
  // THIS IS YOUR EXACT FILE PATH
  loader.load('mannequin_female/manneqqin1.gltf', (gltf) => { 
    const model = gltf.scene;
    model.scale.set(1.8, 1.8, 1.8);
    model.position.y = -0.5;
    scene.add(model);
    
    camera.position.set(0, 1.3, 3.5);
    
    function animate(){
      requestAnimationFrame(animate);
      model.rotation.y += 0.008; // slow spin
      renderer.render(scene, camera);
    }
    animate();
  });
}

loadMannequin('canvas1');
loadMannequin('canvas2'); 
loadMannequin('canvas3');
</script>
</body>
</html>
