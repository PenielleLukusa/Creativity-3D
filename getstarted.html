<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0F0F0F;color:#F5F5F5;background-image:repeating-linear-gradient(90deg,#DDB89210 0 1px,transparent 1px 20px);min-height:100vh}
  .nav{display:flex;gap:10px;background:#1A1A1A;padding:8px 20px;border-radius:30px;width:fit-content;margin:15px auto}
  .nav button.active{background:#DDB892;color:#0F0F0F;font-weight:600}
  .container{background:#DDB892;color:#0F0F0F;max-width:1200px;margin:30px auto;padding:40px;border-radius:16px}
  .model-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:30px}
  .model-card{background:#0F0F0F;border-radius:12px;padding:20px;text-align:center}
  .model-preview{width:100%;height:340px;background:#111;border-radius:10px;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .model-card button{background:#DDB892;color:#0F0F0F;border:none;padding:12px;width:100%;font-weight:700;border-radius:8px;cursor:pointer;margin-top:10px}
  .error-text{color:red;font-size:0.8rem}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="nav">
    <button class="active" onclick="window.location.href='home.html'">Home</button>
    <button>Explore</button>
    <button>Gallery</button>
    <button>Marketplace</button>
  </div>

  <div class="container">
    <h2>Choose your model</h2>
    <div class="model-grid">
      <div class="model-card"><div class="model-preview" id="canvas1"></div><button onclick="window.location.href='workspace.html'">Select</button></div>
      <div class="model-card"><div class="model-preview" id="canvas2"></div><button onclick="window.location.href='workspace.html'">Select</button></div>
      <div class="model-card"><div class="model-preview" id="canvas3"></div><button onclick="window.location.href='workspace.html'">Select</button></div>
    </div>
  </div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

function loadMannequin(containerId){
  const container = document.getElementById(containerId);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111);
  const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.innerHTML = ''; // clear placeholder
  container.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0xDDB892, 1.5));
  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(0,2,5);
  scene.add(light);

  const loader = new GLTFLoader();
  const url = 'https://penielelukusa.github.io/Creativity-3D/mannequin_female/manneqqin1.gltf'; // FULL URL
  
  loader.load(url, (gltf) => { 
    const model = gltf.scene;
    model.scale.set(2, 2, 2);
    model.position.y = -0.8;
    scene.add(model);
    camera.position.set(0, 1.3, 4);
    function animate(){
      requestAnimationFrame(animate);
      model.rotation.y += 0.01;
      renderer.render(scene, camera);
    }
    animate();
  }, undefined, (error) => {
    console.error('GLTF ERROR:', error);
    container.innerHTML = '<p class="error-text">Mannequin failed to load<br>Check file name</p>';
  });
}

loadMannequin('canvas1');
loadMannequin('canvas2'); 
loadMannequin('canvas3');
</script>
</body>
</html>
