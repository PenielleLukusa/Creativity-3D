<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Started - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{
    background:#0F0F0F;
    color:#F5F5F5;
    background-image:repeating-linear-gradient(90deg,#DDB89210 0 1px,transparent 1px 20px);
    min-height:100vh
  }
 .nav{display:flex;gap:10px;background:#1A1A1A;padding:8px 20px;border-radius:30px;width:fit-content;margin:15px auto}
 .nav button{background:transparent;border:none;color:#A0A0A0;padding:8px 20px;border-radius:20px;cursor:pointer;font-size:0.9rem}
 .nav button.active{background:#DDB892;color:#0F0F0F;font-weight:600}
 
 .container{background:#DDB892;color:#0F0F0F;max-width:1200px;margin:30px auto;padding:40px;border-radius:16px;box-shadow:0 8px 30px rgba(221,184,146,0.3)}
  h1{font-size:1.3rem;margin-bottom:20px;font-weight:600}
  h2{text-align:center;margin:10px 0 30px;font-weight:600;font-size:1.5rem}
 
 .model-grid{display:grid;grid-template-columns:repeat(3, 1fr);gap:30px;margin-bottom:30px}
 .model-card{background:#0F0F0F;border-radius:12px;padding:20px;text-align:center;border:2px solid transparent;transition:0.3s;cursor:pointer}
 .model-card:hover{border-color:#DDB892;transform:translateY(-5px)}
 
 /* MANNEQUIN STYLE */
 .model-preview{width:100%;height:340px;background:linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);border-radius:10px;display:flex;align-items:center;justify-content:center;overflow:hidden}
 .mannequin{width:120px;height:300px;fill:#DDB892;opacity:0.9}
 .model-card:hover .mannequin{fill:#E8DCCA}
 
 .model-card button{background:#DDB892;color:#0F0F0F;border:none;padding:12px 20px;border-radius:8px;margin-top:15px;cursor:pointer;font-size:1rem;width:100%;font-weight:700;transition:0.2s}
 .model-card button:hover{background:#E8DCCA}
 
 .customize-link{text-align:center;margin-top:25px}
 .customize-link button{background:#0F0F0F;border:none;color:#DDB892;padding:12px 28px;border-radius:8px;cursor:pointer;font-size:1rem;font-weight:600}
 .customize-link button:hover{background:#1A1A1A}
 
 .customize-wrapper{display:none}
 .back-btn{background:#0F0F0F;color:#DDB892;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;margin-bottom:20px;font-weight:600}
 .back-btn:hover{background:#1A1A1A}
 
 @media(max-width:1000px){.model-grid{grid-template-columns:1fr;gap:20px}}
</style>
</head>
<body>
  <div class="nav">
    <button class="active" onclick="window.location.href='home.html'">Home</button>
    <button>Explore</button>
    <button>Gallery</button>
    <button>Marketplace</button>
  </div>

  <div class="container" id="choosePage">
    <h1>Get started</h1>
    <h2>Choose your model</h2>
    <div class="model-grid">
      <!-- MANNEQUIN 1: Female -->
      <div class="model-card">
        <div class="model-preview">
          <svg class="mannequin" viewBox="0 0 100 300">
            <ellipse cx="50" cy="30" rx="20" ry="20"/> <!-- Head -->
            <rect x="42" y="50" width="16" height="60" rx="8"/> <!-- Torso -->
            <rect x="30" y="110" width="12" height="80" rx="6"/> <!-- Left Leg -->
            <rect x="58" y="110" width="12" height="80" rx="6"/> <!-- Right Leg -->
            <rect x="20" y="55" width="15" height="50" rx="7"/> <!-- Left Arm -->
            <rect x="65" y="55" width="15" height="50" rx="7"/> <!-- Right Arm -->
          </svg>
        </div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>

      <!-- MANNEQUIN 2: Slim -->
      <div class="model-card">
        <div class="model-preview">
          <svg class="mannequin" viewBox="0 0 100 300">
            <ellipse cx="50" cy="30" rx="18" ry="18"/>
            <rect x="44" y="50" width="12" height="60" rx="6"/>
            <rect x="33" y="110" width="10" height="80" rx="5"/>
            <rect x="57" y="110" width="10" height="80" rx="5"/>
            <rect x="24" y="55" width="13" height="50" rx="6"/>
            <rect x="63" y="55" width="13" height="50" rx="6"/>
          </svg>
        </div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>

      <!-- MANNEQUIN 3: Curvy -->
      <div class="model-card">
        <div class="model-preview">
          <svg class="mannequin" viewBox="0 0 100 300">
            <ellipse cx="50" cy="30" rx="22" ry="22"/>
            <rect x="40" y="50" width="20" height="60" rx="10"/>
            <rect x="28" y="110" width="14" height="80" rx="7"/>
            <rect x="58" y="110" width="14" height="80" rx="7"/>
            <rect x="18" y="55" width="17" height="50" rx="8"/>
            <rect x="65" y="55" width="17" height="50" rx="8"/>
          </svg>
        </div>
        <button onclick="window.location.href='workspace.html'">Select</button>
      </div>
    </div>
    <div class="customize-link">
      <button onclick="document.getElementById('choosePage').style.display='none';document.getElementById('customizePage').style.display='block'">Customize Your Own Model</button>
    </div>
  </div>

  <div class="container customize-wrapper" id="customizePage">
    <button class="back-btn" onclick="document.getElementById('choosePage').style.display='block';document.getElementById('customizePage').style.display='none'">‹ Back</button>
    <h2>Customize your own model</h2>
    <div style="background:#0F0F0F;color:#DDB892;padding:30px;border-radius:12px;text-align:center;margin-top:20px">
      <p>Add measurements here</p>
      <button style="background:#DDB892;color:#0F0F0F;padding:12px 30px;border:none;border-radius:8px;margin-top:15px;cursor:pointer;font-weight:700" onclick="window.location.href='workspace.html'">Create</button>
    </div>
  </div>
</body>
</html>
