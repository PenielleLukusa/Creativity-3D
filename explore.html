<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0F0F0F;color:#F5F5F5;padding:20px}
  .nav{display:flex;gap:10px;background:#1A1A1A;padding:8px;border-radius:30px;width:fit-content;margin:0 auto 30px}
  .nav button{background:transparent;border:none;color:#A0A0A0;padding:8px 20px;border-radius:20px;cursor:pointer}
  .nav .active{background:#DDB892;color:#0F0F0F;font-weight:600}
  h2{margin-bottom:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:150px;gap:12px}
  .card{background:#1A1A1A;border-radius:12px;position:relative;overflow:hidden;cursor:pointer;transition:0.3s}
  .card:hover{transform:scale(1.03)}
  .card.large{grid-row:span 2;grid-column:span 2}
  .card.tall{grid-row:span 2}
  .card img{width:100%;height:100%;object-fit:cover;background:#222;display:flex;align-items:center;justify-content:center;color:#555}
  .card span{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.6);padding:4px 8px;border-radius:20px;font-size:0.8rem}
</style>
</head>
<body>
  <div class="nav">
    <button>Home</button><button class="active">Explore</button><button onclick="window.location.href='profile.html'">Gallery</button><button>Marketplace</button>
  </div>

  <h2>Discover other people creations</h2>
  
  <div class="grid" id="grid">
    <!-- Cards will load from localStorage/Firebase -->
  </div>

<script>
  // Dummy data for now. Later we pull from Firebase "gallery" collection
  const dummy = [
    {size:'small'},{size:'small'},{size:'large'},{size:'small'},{size:'tall'},
    {size:'large'},{size:'small'},{size:'small'},{size:'small'},{size:'large'},
    {size:'small'},{size:'small'},{size:'small'},{size:'small'},{size:'large'}
  ];
  
  const grid = document.getElementById('grid');
  dummy.forEach(item=>{
    const div = document.createElement('div');
    div.className = `card ${item.size}`;
    div.innerHTML = `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:40px">⛰️</div><span>See more</span>`;
    div.onclick = () => alert('Open design detail page');
    grid.appendChild(div);
  });
</script>
</body>
</html>
