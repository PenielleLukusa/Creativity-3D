<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0F0F0F;color:#F5F5F5;text-align:center;padding:40px 20px}
  .avatar{width:100px;height:100px;border-radius:50%;background:#2a2a2a;margin:0 auto 15px;display:flex;align-items:center;justify-content:center;font-size:40px}
  .settings{position:absolute;top:20px;right:20px;background:#1A1A1A;border:none;width:40px;height:40px;border-radius:8px;color:#DDB892;cursor:pointer}
  h2{background:#1A1A1A;padding:12px;margin:20px -20px}
  .menu-btn{width:90%;max-width:400px;background:#1A1A1A;border:none;color:#F5F5F5;padding:15px;margin:8px 0;border-radius:10px;font-size:1rem;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
  .menu-btn:hover{background:#2a2a2a}
  .icon{color:#DDB892}
</style>
</head>
<body>
  <button class="settings">⚙️</button>
  <div class="avatar">👤</div>
  <h2>Profile</h2>

  <button class="menu-btn" onclick="window.location.href='favorites.html'"><span>Favorite <span class="icon">♡</span></span><span>▶</span></button>
  <button class="menu-btn" onclick="window.location.href='my-creations.html'"><span>My creation</span><span>▶</span></button>
  <button class="menu-btn"><span>Language <span class="icon">🌐</span></span><span>▶</span></button>
  <button class="menu-btn"><span>Review <span class="icon">⭐</span></span><span>▶</span></button>
  <button class="menu-btn"><span>Log out <span class="icon">↪</span></span><span>▶</span></button>
</body>
</html>
