<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0F0F0F;color:#F5F5F5;min-height:100vh;padding:20px;background-image:repeating-linear-gradient(90deg,#DDB89210 0 1px,transparent 1px 20px)}
 .nav{display:flex;gap:10px;background:#1A1A1A;padding:8px;border-radius:30px;width:fit-content;margin:0 auto;flex-wrap:wrap}
 .nav button{background:transparent;border:none;color:#A0A0A0;padding:8px 20px;border-radius:20px;cursor:pointer;font-size:0.9rem}
 .nav.active{background:#DDB892;color:#0F0F0F;font-weight:600}
 .nav button:hover{background:#2a2a2a}
 .avatar{position:absolute;top:20px;right:20px;width:35px;height:35px;border-radius:50%;background:#2a2a2a;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600}
 .content{max-width:800px;margin:80px auto;text-align:center}
  h1{font-size:1.8rem;margin-bottom:10px;color:#DDB892}
  p{color:#A0A0A0;line-height:1.6}
 .btn{background:#DDB892;color:#0F0F0F;border:none;padding:12px 30px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:20px;font-size:1rem}
 .btn:hover{background:#E8DCCA}
 .bubble{background:#1A1A1A;border-radius:30px 30px 0 30px;padding:30px;margin-top:60px;max-width:400px;margin-left:auto;text-align:left}
 .bubble.btn{background:#F5F5F5}
 .bubble.btn:hover{background:#E8E8E8}
  @media(max-width:768px){
   .nav{gap:5px;padding:6px}
   .nav button{padding:6px 12px;font-size:0.8rem}
   .content{margin:60px 20px}
  }

 onAuthStateChanged(auth, (user) => {
  if (user) {
    avatar.textContent = user.email[0].toUpperCase();
    document.querySelector('h1').textContent = `Welcome, ${user.email.split('@')[0]}`;
  } else {
    window.location.href = 'index.html';
  }
});
</style>
</head>
<body>
  <div class="avatar" id="avatar">?</div>

  <div class="nav">
    <button class="active">Home</button>
    <button onclick="window.location.href='explore.html'">Explore</button>
    <button onclick="window.location.href='gallery.html'">Gallery</button>
    <button onclick="window.location.href='marketplace.html'">Marketplace</button>
    
  </div>

  <div class="content">
    <h1>Build your Wardrobe</h1>
    <p>With a 3D mannequin<br>And export it for your future projects</p>
    <button class="btn" onclick="window.location.href='workspace.html'">Get started</button>

    <div class="bubble">
      <p><b>Would you like to create<br>your own fabric design<br>and texture?</b><br>We got you</p>
      <button class="btn" onclick="window.location.href='customize.html'">Create</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCQF_gA_isYuLQWE8zTFuKKhMuDGO3Epcg",
    authDomain: "creativity-3d.firebaseapp.com",
    projectId: "creativity-3d",
    storageBucket: "creativity-3d.firebasestorage.app",
    messagingSenderId: "489202381387",
    appId: "1:489202381387:web:f9f89c85c53fba83f8d3ce"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const authBtn = document.getElementById('authBtn');
  const avatar = document.getElementById('avatar');

  // Protect this page - kick out if not logged in
  onAuthStateChanged(auth, (user) => {
    if (user) {
      avatar.textContent = user.email[0].toUpperCase();
    } else {
      window.location.href = 'index.html'; // send to welcome if not logged in
    }
  });

  // Logout
  authBtn.onclick = () => {
    signOut(auth).then(() => {
      window.location.href = 'index.html';
    });
  }
</script>
</body>
</html>
