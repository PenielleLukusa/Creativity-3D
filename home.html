<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0F0F0F;color:#F5F5F5;min-height:100vh;padding:20px}
 .nav{display:flex;gap:10px;background:#1A1A1A;padding:8px;border-radius:30px;width:fit-content;margin:0 auto}
 .nav button.active{background:#DDB892;color:#0F0F0F;font-weight:600;border:none;padding:8px 20px;border-radius:20px}
 .content{max-width:800px;margin:80px auto;text-align:center}
  h1{font-size:1.8rem;margin-bottom:10px;color:#DDB892}
  p{color:#A0A0A0;line-height:1.6}
 .btn{background:#DDB892;color:#0F0F0F;border:none;padding:14px 32px;border-radius:8px;font-weight:600;cursor:pointer;margin-top:20px;font-size:1rem}
 .btn:hover{background:#E8DCCA}
</style>
</head>
<body>
  <div class="nav"><button class="active">Home</button></div>
  <div class="content">
    <h1>Build your Wardrobe</h1>
    <p>With a 3D mannequin<br>And export it for your future projects</p>
    <button class="btn" onclick="window.location.href='getstarted.html'">Get started</button>
  </div>
</body>
</html>
