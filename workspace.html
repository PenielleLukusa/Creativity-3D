<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0A0B;
    --panel:#121214;
    --panel-2:#1A1A1E;
    --border:#23232A;
    --accent:#DDB892;
    --text:#F5F5F7;
    --text-muted:#8A8A93;
    --glass:rgba(18,18,20,0.7);
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

  /* TOPBAR GLASS */
 .topbar{
    background:var(--glass);
    backdrop-filter: blur(12px);
    padding:0 20px;
    display:flex;
    gap:2px;
    border-bottom:1px solid var(--border);
    font-size:0.875rem;
    position:relative;
    z-index:100;
  }
 .menu{position:relative}
 .menu-title{padding:12px 16px;cursor:pointer;color:var(--text-muted);transition:0.2s;border-radius:6px}
 .menu:hover.menu-title{background:var(--panel-2);color:var(--text)}
 .dropdown{
    position:absolute;top:110%;left:0;background:var(--panel);
    border:1px solid var(--border);border-radius:10px;min-width:220px;
    display:none;padding:6px;box-shadow:0 8px 30px rgba(0,0,0,0.4)
  }
 .menu:hover.dropdown{display:block}
 .dropdown-item{padding:10px 14px;cursor:pointer;color:var(--text);font-size:0.85rem;border-radius:6px}
 .dropdown-item:hover{background:var(--accent);color:#0A0A0B}
 .dropdown-divider{height:1px;background:var(--border);margin:6px 0}

 .workspace{display:flex;flex:1;gap:12px;padding:12px}

  /* GLASS PANELS */
 .left-panel,.right-panel{
    width:300px;background:var(--glass);backdrop-filter: blur(16px);
    border:1px solid var(--border);border-radius:16px;padding:18px;overflow-y:auto
  }
 .center{
    flex:1;position:relative;background:#000;border:1px solid var(--border);
    border-radius:16px;overflow:hidden
  }
  #canvas{width:100%;height:100%;display:block}

 .tool-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
 .tool-btn{
    width:42px;height:42px;background:var(--panel-2);border:1px solid var(--border);
    border-radius:12px;color:var(--text-muted);cursor:pointer;font-size:1.1rem;transition:0.2s
  }
 .tool-btn:hover{background:var(--accent);color:#0A0A0B;border-color:var(--accent)}

 .section{background:var(--panel-2);padding:14px;border-radius:12px;margin-bottom:14px;border:1px solid var(--border)}
 .section h4{color:var(--accent);font-size:0.8rem;margin-bottom:12px;font-weight:600;letter-spacing:0.5px;text-transform:uppercase}
 .fabric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
 .fabric-swatch{width:100%;aspect-ratio:1;background:#333;border-radius:8px;cursor:pointer;border:2px solid transparent;transition:0.2s}
 .fabric-swatch:hover{border-color:var(--accent);transform:scale(1.05)}
 .btn{background:var(--accent);color:#0A0A0B;border:none;padding:12px;width:100%;border-radius:10px;font-weight:600;cursor:pointer;margin-top:12px;transition:0.2s}
 .btn:hover{opacity:0.9;transform:translateY(-1px)}
 .layer-item{padding:8px 10px;background:var(--panel);border-radius:8px;margin-bottom:6px;font-size:0.85rem;color:var(--text-muted)}
</style>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="topbar">
    <div class="menu">
      <div class="menu-title">File</div>
      <div class="dropdown">
        <div class="dropdown-item" onclick="saveGLB()">Save as GLB</div>
        <div class="dropdown-item" onclick="savePNG()">Export as PNG</div>
      </div>
    </div>
    <div class="menu"><div class="menu-title">Edit</div><div class="dropdown"><div class="dropdown-item">Undo</div><div class="dropdown-item">Redo</div></div></div>
    <div class="menu"><div class="menu-title">View</div><div class="dropdown"><div class="dropdown-item" onclick="togglePanel('left')">Toggle Left Panel</div><div class="dropdown-item" onclick="togglePanel('right')">Toggle Right Panel</div></div></div>
    <div class="menu"><div class="menu-title">Window</div><div class="dropdown"><div class="dropdown-item">AI Chat</div><div class="dropdown-item">Layers</div></div></div>
  </div>

  <div class="workspace">
    <div class="left-panel" id="leftPanel">
      <div class="tool-bar">
        <button class="tool-btn" title="Pan">✋</button><button class="tool-btn" title="Rotate">↻</button><button class="tool-btn" title="Measure">📐</button>
        <button class="tool-btn" title="Cut">✂️</button><button class="tool-btn" title="Paint">🎨</button><button class="tool-btn" title="Ruler">📏</button>
      </div>
      <div class="section">
        <h4>AI Assistant</h4>
        <input placeholder="Ask AI to generate fabric..." style="width:100%;padding:10px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--text)">
      </div>
    </div>

    <div class="center">
      <canvas id="canvas"></canvas>
    </div>

    <div class="right-panel" id="rightPanel">
      <div class="section">
        <h4>Layers</h4>
        <div class="layer-item">Mannequin</div>
        <div class="layer-item">Dart 1</div>
        <div class="layer-item">Background</div>
      </div>
      <div class="section">
        <h4>Fabric Panel</h4>
        <div class="fabric-grid">
          <div class="fabric-swatch" style="background:linear-gradient(45deg,#444,#555)"></div>
          <div class="fabric-swatch" style="background:#DDB892"></div>
          <div class="fabric-swatch" style="background:#8B5A2B"></div>
          <div class="fabric-swatch" style="background:#EC4899"></div>
        </div>
      </div>
      <div class="section">
        <h4>Texture Panel</h4>
        <div class="fabric-grid">
          <div class="fabric-swatch"></div><div class="fabric-swatch"></div><div class="fabric-swatch"></div><div class="fabric-swatch"></div>
        </div>
      </div>
      <button class="btn">Open Marketplace</button>
    </div>
  </div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
  import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0A0A0B);
  scene.fog = new THREE.Fog(0x0A0A0B, 5, 20);

  const canvas = document.getElementById('canvas');
  const camera = new THREE.PerspectiveCamera(50, canvas.clientWidth/canvas.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({canvas:canvas,antialias:true,preserveDrawingBuffer:true});
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  renderer.setPixelRatio(window.devicePixelRatio);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true; controls.dampingFactor = 0.05;
  camera.position.set(0,1.5,4); controls.target.set(0,1.2,0);

  // SOFT STUDIO LIGHTING
  scene.add(new THREE.AmbientLight(0xDDB892, 0.4));
  const keyLight = new THREE.DirectionalLight(0xffffff, 0.8);
  keyLight.position.set(3,4,3);
  scene.add(keyLight);

  // HUMAN MANNEQUIN - NO AUTO SPIN
  const mat = new THREE.MeshBasicMaterial({color:0xffffff, wireframe:true, transparent:true, opacity:0.8});
  const human = new THREE.Group();
  human.add(new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.35, 1.2, 16), mat)).position.y = 1.2;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 16), mat); head.position.y = 2.1; human.add(head);
  const armGeo = new THREE.CylinderGeometry(0.06, 0.06, 0.9, 8);
  const lArm = new THREE.Mesh(armGeo, mat); lArm.position.set(-0.4, 1.3, 0); lArm.rotation.z = 0.4; human.add(lArm);
  const rArm = new THREE.Mesh(armGeo, mat); rArm.position.set(0.4, 1.3, 0); rArm.rotation.z = -0.4; human.add(rArm);
  const legGeo = new THREE.CylinderGeometry(0.1, 0.1, 1.3, 8);
  human.add(new THREE.Mesh(legGeo, mat)).position.set(-0.15, -0.05, 0);
  human.add(new THREE.Mesh(legGeo, mat)).position.set(0.15, -0.05, 0);
  scene.add(human);

  function animate(){requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera)}
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  });
  window.togglePanel = (side) => {
    const panel = document.getElementById(side + 'Panel');
    panel.style.display = panel.style.display === 'none'? 'block' : 'none';
  }
  window.saveGLB = () => {
    const exporter = new GLTFExporter();
    exporter.parse(human, (glb) => {
      const blob = new Blob([glb], {type: 'application/octet-stream'});
      const link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'mannequin.glb'; link.click();
    }, {binary: true});
  }
  window.savePNG = () => {
    const link = document.createElement('a'); link.href = canvas.toDataURL('image/png'); link.download = 'screenshot.png'; link.click();
  }
</script>
</body>
</html>
