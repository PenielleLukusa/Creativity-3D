<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{background:#0B0B0D;color:#F1F1F3;height:100vh;display:flex;flex-direction:column}

  .topbar{background:#141416;padding:0 20px;display:flex;gap:0;border-bottom:1px solid #23232A;z-index:100;flex-wrap:wrap} /* ADDED flex-wrap */
  .menu{position:relative;flex-shrink:0} /* ADDED flex-shrink */
  .menu-title{padding:12px 16px;cursor:pointer;color:#A1A1AA;font-size:14px;white-space:nowrap} /* ADDED nowrap */
  .menu:hover .menu-title{background:#23232A;color:#fff}
  .dropdown{position:absolute;top:100%;left:0;background:#1C1C20;border:1px solid #23232A;border-radius:8px;min-width:200px;display:none;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,0.5)}
  .menu:hover .dropdown{display:block}
  .dropdown-item{padding:10px 12px;cursor:pointer;color:#F1F1F3;font-size:13px;border-radius:6px}
  .dropdown-item:hover{background:#DDB892;color:#0B0B0D}

  .workspace{display:flex;flex:1;gap:12px;padding:12px;overflow:hidden} /* moved overflow here */
  .panel{width:280px;background:#141416;border:1px solid #23232A;border-radius:12px;padding:16px;overflow-y:auto}
  .center{flex:1;background:#0F0F12;border:1px solid #23232A;border-radius:12px;position:relative;overflow:hidden}
  #canvas{width:100%;height:100%;display:block}

  .tools{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
  .tool{width:38px;height:38px;background:#1C1C20;border:1px solid #23232A;border-radius:10px;color:#DDB892;cursor:pointer;font-size:16px}
  .tool:hover{background:#DDB892;color:#0B0B0D}
  .sec{background:#1C1C20;padding:12px;border-radius:10px;margin-bottom:12px}
  .sec h4{color:#DDB892;font-size:12px;margin-bottom:10px;font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .swatch{aspect-ratio:1;background:#2a2a30;border-radius:8px;cursor:pointer;border:2px solid transparent}
  .swatch:hover{border-color:#DDB892}
  .btn{width:100%;padding:12px;background:#DDB892;color:#0B0B0D;border:none;border-radius:10px;font-weight:600;cursor:pointer}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="topbar">
    <div class="menu"><div class="menu-title">File</div><div class="dropdown"><div class="dropdown-item" onclick="savePNG()">Export PNG</div></div></div>
    <div class="menu"><div class="menu-title">Edit</div><div class="dropdown"><div class="dropdown-item">Undo</div><div class="dropdown-item">Redo</div></div></div>
    <div class="menu"><div class="menu-title">Layout</div><div class="dropdown"><div class="dropdown-item">Show Grid</div></div></div>
    <div class="menu"><div class="menu-title">View</div><div class="dropdown"><div class="dropdown-item" onclick="toggle('left')">Toggle Left</div><div class="dropdown-item" onclick="toggle('right')">Toggle Right</div></div></div>
    <div class="menu"><div class="menu-title">Window</div><div class="dropdown"><div class="dropdown-item">AI Chat</div></div></div>
  </div>

  <div class="workspace">
    <div class="panel" id="left">
      <div class="tools">
        <button class="tool">✋</button><button class="tool">↻</button><button class="tool">📐</button>
        <button class="tool">✂️</button><button class="tool">🎨</button><button class="tool">📏</button>
      </div>
      <div class="sec"><h4>AI TOOLS</h4><input placeholder="Generate fabric..." style="width:100%;padding:10px;background:#0B0B0D;border:1px solid #23232A;border-radius:8px;color:#fff"></div>
    </div>

    <div class="center"><canvas id="canvas"></canvas></div>

    <div class="panel" id="right">
      <div class="sec"><h4>LAYERS</h4><div style="font-size:13px;color:#A1A1AA">Dress Form</div></div>
      <div class="sec"><h4>FABRICS</h4><div class="grid"><div class="swatch" style="background:#DDB892"></div><div class="swatch" style="background:#8B5A2B"></div><div class="swatch" style="background:#EC4899"></div><div class="swatch" style="background:#444"></div></div></div>
      <button class="btn">Marketplace</button>
    </div>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0F0F12);
const canvas = document.getElementById('canvas');
const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth/canvas.clientHeight, 0.1, 100);
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(canvas.clientWidth, canvas.clientHeight);

const controls = new OrbitControls(camera, renderer.domElement);
camera.position.set(0,1.4,3.2); controls.target.set(0,1.2,0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
scene.add(new THREE.DirectionalLight(0xffffff, 0.8)).position.set(2,3,2);

const mat = new THREE.MeshStandardMaterial({color:0xEEEEEE, roughness:0.4});
const form = new THREE.Group();
form.add(new THREE.Mesh(new THREE.CylinderGeometry(0.3,0.4,1.1,32), mat)).position.y = 1.1;
form.add(new THREE.Mesh(new THREE.SphereGeometry(0.2,32,32), mat)).position.y = 1.95;
const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,0.7,16), mat);
form.add(arm.clone()).position.set(-0.4,1.2,0).rotation.z = 0.5;
form.add(arm.clone()).position.set(0.4,1.2,0).rotation.z = -0.5;
form.add(new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1,16), mat)).position.set(-0.13,-0.1,0);
form.add(new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.09,1,16), mat)).position.set(0.13,-0.1,0);
scene.add(form);

function animate(){requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera)} animate();
window.addEventListener('resize', ()=>{camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();renderer.setSize(canvas.clientWidth,canvas.clientHeight)});
window.toggle = (id)=>{const el=document.getElementById(id); el.style.display = el.style.display==='none'?'block':'none'}
window.savePNG = ()=>{const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download='atelier.png'; a.click()}
</script>
</body>
</html>
