<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workspace - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0F0F0F;color:#F5F5F5;height:100vh;display:flex;flex-direction:column;overflow:hidden}
  
  .topbar{background:#1A1A1A;padding:0 15px;display:flex;gap:0;border-bottom:1px solid #2a2a2a;font-size:0.9rem;position:relative;z-index:100;flex-wrap:wrap}
  .menu{position:relative;flex-shrink:0}
  .menu-title{padding:10px 14px;cursor:pointer;color:#DDB892;transition:0.2s;white-space:nowrap}
  .menu:hover .menu-title{background:#DDB892;color:#0F0F0F}
  .dropdown{position:absolute;top:100%;left:0;background:#2A2A2A;border:1px solid #333;border-radius:6px;min-width:200px;display:none;padding:5px 0;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
  .menu:hover .dropdown{display:block}
  .dropdown-item{padding:8px 15px;cursor:pointer;color:#F5F5F5;font-size:0.85rem}
  .dropdown-item:hover{background:#DDB892;color:#0F0F0F}
  .dropdown-divider{height:1px;background:#333;margin:5px 0}

  .workspace{display:flex;flex:1;overflow:hidden}
  .left-panel{width:280px;background:#1A1A1A;border-right:1px solid #2a2a2a;padding:15px;overflow-y:auto}
  .center{flex:1;position:relative;background:#222}
  .right-panel{width:300px;background:#1A1A1A;border-left:1px solid #2a2a2a;padding:15px;overflow-y:auto}
  #canvas{width:100%;height:100%;display:block}
  .tool-btn{width:40px;height:40px;background:#2a2a2a;border:none;border-radius:8px;margin:5px;color:#DDB892;cursor:pointer;font-size:1.2rem}
  .tool-btn:hover{background:#DDB892;color:#0F0F0F}
  .section{background:#222;padding:10px;border-radius:8px;margin:10px 0}
  .section h4{color:#DDB892;font-size:0.9rem;margin-bottom:8px}
  .fabric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .fabric-swatch{width:100%;aspect-ratio:1;background:#333;border-radius:4px;cursor:pointer;border:2px solid transparent}
  .fabric-swatch:hover{border-color:#DDB892}
  .btn{background:#DDB892;color:#0F0F0F;border:none;padding:10px;width:100%;border-radius:8px;font-weight:600;cursor:pointer;margin-top:10px}
</style>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="topbar">
    <div class="menu"><div class="menu-title">File</div><div class="dropdown"><div class="dropdown-item" onclick="savePNG()">Export PNG</div></div></div>
    <div class="menu"><div class="menu-title">Edit</div><div class="dropdown"><div class="dropdown-item">Undo</div></div></div>
    <div class="menu"><div class="menu-title">Layout</div><div class="dropdown"><div class="dropdown-item">Show Grid</div></div></div>
    <div class="menu"><div class="menu-title">Image</div><div class="dropdown"><div class="dropdown-item">Import</div></div></div>
    <div class="menu"><div class="menu-title">Filter</div><div class="dropdown"><div class="dropdown-item">Colors</div></div></div>
    <div class="menu"><div class="menu-title">View</div><div class="dropdown"><div class="dropdown-item" onclick="togglePanel('left')">Toggle Left</div><div class="dropdown-item" onclick="togglePanel('right')">Toggle Right</div></div></div>
    <div class="menu"><div class="menu-title">Select</div><div class="dropdown"><div class="dropdown-item">Select All</div></div></div>
    <div class="menu"><div class="menu-title">Window</div><div class="dropdown"><div class="dropdown-item">AI Chat</div></div></div>
  </div>

  <div class="workspace">
    <div class="left-panel" id="leftPanel">
      <div style="display:flex;gap:5px;flex-wrap:wrap">
        <button class="tool-btn" title="Pan">✋</button><button class="tool-btn" title="Rotate">↻</button><button class="tool-btn" title="Measure">📐</button>
        <button class="tool-btn" title="Cut">✂️</button><button class="tool-btn" title="Paint">🎨</button><button class="tool-btn" title="Ruler">📏</button>
      </div>
      <div class="section"><h4>AI TOOLS</h4><input placeholder="Generate fabric..." style="width:100%;padding:8px;background:#0F0F0F;border:1px solid #333;border-radius:6px;color:#F5F5F5"></div>
    </div>

    <div class="center"><canvas id="canvas"></canvas></div>

    <div class="right-panel" id="rightPanel">
      <div class="section"><h4>LAYERS</h4><p style="font-size:0.85rem;color:#aaa">Dress Form</p></div>
      <div class="section"><h4>FABRIC PANEL</h4><div class="fabric-grid"><div class="fabric-swatch" style="background:#DDB892"></div><div class="fabric-swatch" style="background:#8B5A2B"></div><div class="fabric-swatch" style="background:#EC4899"></div><div class="fabric-swatch" style="background:#444"></div></div></div>
      <button class="btn">Marketplace</button>
    </div>
  </div>

<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x222222);
  const canvas = document.getElementById('canvas');
  const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth/canvas.clientHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({canvas:canvas,antialias:true});
  renderer.setSize(canvas.clientWidth, canvas.clientHeight);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  camera.position.set(0,1.5,3.5);
  controls.target.set(0,1.2,0);

  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const light = new THREE.DirectionalLight(0xffffff, 1);
  light.position.set(2,3,2);
  scene.add(light);

  // SOLID DRESS FORM - FIXED
  const mat = new THREE.MeshStandardMaterial({color:0xEEEEEE, roughness:0.3});
  const mannequin = new THREE.Group();
  
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.36, 1.0, 32), mat);
  torso.position.y = 1.0;
  mannequin.add(torso);
  
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.11, 0.15, 16), mat);
  neck.position.y = 1.575;
  mannequin.add(neck);
  
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.19, 32, 32), mat);
  head.position.y = 1.85;
  mannequin.add(head);
  
  const armGeo = new THREE.CylinderGeometry(0.05, 0.05, 0.7, 16);
  const lArm = new THREE.Mesh(armGeo, mat); lArm.position.set(-0.45, 1.15, 0); lArm.rotation.z = 0.6; mannequin.add(lArm);
  const rArm = new THREE.Mesh(armGeo, mat); rArm.position.set(0.45, 1.15, 0); rArm.rotation.z = -0.6; mannequin.add(rArm);
  
  const legGeo = new THREE.CylinderGeometry(0.09, 0.09, 1.0, 16);
  const lLeg = new THREE.Mesh(legGeo, mat); lLeg.position.set(-0.14, -0.1, 0); mannequin.add(lLeg);
  const rLeg = new THREE.Mesh(legGeo, mat); rLeg.position.set(0.14, -0.1, 0); mannequin.add(rLeg);
  
  const base = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.28, 0.12, 32), new THREE.MeshStandardMaterial({color:0x333}));
  base.position.y = -0.66;
  mannequin.add(base);
  
  scene.add(mannequin);

  function animate(){
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene,camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = canvas.clientWidth / canvas.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(canvas.clientWidth, canvas.clientHeight);
  });
  
  window.togglePanel = (side) => {
    const panel = document.getElementById(side + 'Panel');
    panel.style.display = panel.style.display === 'none'? 'block' : 'none';
  }
  
  window.savePNG = () => {
    const link = document.createElement('a');
    link.href = canvas.toDataURL('image/png');
    link.download = 'workspace.png';
    link.click();
  }
</script>
</body>
</html>
