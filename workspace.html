<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Atelier Pro</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}
  body{background:#0B0B0D;color:#F1F1F3;height:100vh;display:flex;flex-direction:column}

 .topbar{background:#141416;padding:0 15px;display:flex;gap:0;border-bottom:1px solid #23232A;font-size:13px;z-index:9999;position:relative}
 .menu{position:relative}
 .menu-title{padding:10px 14px;cursor:pointer;color:#A1A1AA}
 .menu:hover.menu-title{background:#23232A;color:#DDB892}
 .dropdown{position:absolute;top:100%;left:0;background:#1C1C20;border:1px solid #23232A;border-radius:8px;min-width:220px;display:none;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,0.5);z-index:10000}
 .menu:hover.dropdown{display:block}
 .dropdown-item{padding:8px 12px;cursor:pointer;color:#F1F1F3;font-size:12px;border-radius:6px}
 .dropdown-item:hover{background:#DDB892;color:#0B0B0D}
 .divider{height:1px;background:#23232A;margin:6px 0}

 .workspace{display:flex;flex:1;overflow:hidden}
 .left-toolbar{width:60px;background:#141416;border-right:1px solid #23232A;padding:10px 0;display:flex;flex-direction:column;align-items:center;gap:8px}
 .tool-icon{width:40px;height:40px;background:#1C1C20;border:1px solid #23232A;border-radius:8px;color:#DDB892;cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center}
 .tool-icon:hover{background:#DDB892;color:#0B0B0D}
 .tool-icon.active{background:#DDB892;color:#0B0B0D}
 .center{flex:1;background:#0B0B0D;position:relative}
  #canvas{width:100%;height:100%;display:block}

 .right-panel{width:300px;background:#141416;border-left:1px solid #23232A;display:flex;flex-direction:column}
 .panel-tabs{display:flex;border-bottom:1px solid #23232A}
 .tab{flex:1;padding:10px;text-align:center;font-size:11px;cursor:pointer;color:#A1A1AA}
 .tab.active{background:#1C1C20;color:#DDB892;border-bottom:2px solid #DDB892}
 .panel-content{flex:1;overflow-y:auto;padding:12px}

  /* GALLERY GRID */
 .gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .gallery-item{background:#1C1C20;border:1px solid #23232A;border-radius:8px;padding:8px;cursor:pointer}
 .gallery-item img{width:100%;border-radius:6px;background:#0B0B0D}
 .gallery-item p{font-size:10px;margin-top:5px;color:#DDB892}
 .gallery-btn{width:100%;padding:6px;background:#DDB892;color:#0B0B0D;border:none;border-radius:6px;font-size:10px;font-weight:600;margin-top:5px;cursor:pointer}
</style>
<script type="importmap">{"imports": {"three": "https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
  <div class="topbar">
    <div class="menu"><div class="menu-title">File</div><div class="dropdown"><div class="dropdown-item">New Design</div><div class="dropdown-item">Open</div><div class="dropdown-item">Save</div><div class="dropdown-item">Save as GLB</div><div class="divider"></div><div class="dropdown-item" onclick="exportToGallery()">Export to Gallery</div></div></div>
    <div class="menu"><div class="menu-title">Edit</div><div class="dropdown"><div class="dropdown-item">Undo</div><div class="dropdown-item">Redo</div></div></div>
    <div class="menu"><div class="menu-title">Layout</div><div class="dropdown"><div class="dropdown-item">Show Comments</div><div class="dropdown-item">Show Grid</div></div></div>
    <div class="menu"><div class="menu-title">Image</div><div class="dropdown"><div class="dropdown-item">Import Fabric Image</div></div></div>
    <div class="menu"><div class="menu-title">View</div><div class="dropdown"><div class="dropdown-item" onclick="switchTab('layers')">Layers</div><div class="dropdown-item" onclick="switchTab('gallery')">Gallery</div><div class="dropdown-item" onclick="switchTab('marketplace')">Marketplace</div></div></div>
    <div class="menu"><div class="menu-title">Window</div><div class="dropdown"><div class="dropdown-item">AI Chat</div><div class="dropdown-item">Fabric Panel</div></div></div>
  </div>

  <div class="workspace">
    <div class="left-toolbar" id="leftToolbar">
      <div class="tool-icon active">↖</div>
      <div class="tool-icon">✋</div>
      <div class="tool-icon">↻</div>
      <div class="tool-icon">📐</div>
      <div class="tool-icon">✂️</div>
      <div class="tool-icon">🎨</div>
    </div>

    <div class="center"><canvas id="canvas"></canvas></div>

    <div class="right-panel">
      <div class="panel-tabs">
        <div class="tab active" onclick="switchTab('layers')">LAYERS</div>
        <div class="tab" onclick="switchTab('gallery')">GALLERY</div>
        <div class="tab" onclick="switchTab('marketplace')">MARKET</div>
      </div>
      <div class="panel-content" id="panelContent">
        <!-- CONTENT LOADS HERE -->
      </div>
    </div>
  </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// THREE.JS SETUP
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0B0B0D);
const canvas = document.getElementById('canvas');
const camera = new THREE.PerspectiveCamera(45, canvas.clientWidth/canvas.clientHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setSize(canvas.clientWidth, canvas.clientHeight);
const controls = new OrbitControls(camera, renderer.domElement);
camera.position.set(3,2,4); controls.target.set(0,0,0);

// LIGHTS
scene.add(new THREE.AmbientLight(0xDDB892, 0.4));
const keyLight = new THREE.SpotLight(0xffffff, 2); keyLight.position.set(0, 4, 6); scene.add(keyLight);
const rimLight = new THREE.PointLight(0xDDB892, 3, 15); rimLight.position.set(0, 0, -4); scene.add(rimLight);

// MANNEQUIN
const goldMat = new THREE.MeshStandardMaterial({color: 0xDDB892, emissive: 0xDDB892, emissiveIntensity: 0.3, wireframe: true});
const cylinder = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2.5, 16, 1, true), goldMat); cylinder.position.y = -0.5; scene.add(cylinder);
const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), goldMat); sphere.position.y = 1.2; scene.add(sphere);
function animate(){requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera)} animate();

// GALLERY SYSTEM
let gallery = JSON.parse(localStorage.getItem('atelierGallery')) || [];

window.switchTab = (tab) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  const content = document.getElementById('panelContent');
  if(tab === 'layers'){
    content.innerHTML = `<div class="panel-sec"><h4>LAYERS</h4><div class="layer-item">Dart 1</div><div class="layer-item">Dart 2</div></div>`;
  }
  if(tab === 'gallery'){
    renderGallery(content, false);
  }
  if(tab === 'marketplace'){
    renderGallery(content, true);
  }
}

function renderGallery(container, isMarket){
  if(gallery.length === 0){
    container.innerHTML = `<p style="font-size:12px;color:#A1A1AA;text-align:center;margin-top:20px">No designs yet. Click File > Export to Gallery</p>`;
    return;
  }
  let html = '<div class="gallery-grid">';
  gallery.forEach((item, i) => {
    html += `
      <div class="gallery-item">
        <img src="${item.image}" />
        <p>${item.name}</p>
        ${isMarket? `<button class="gallery-btn" onclick="publishItem(${i})">Publish</button>` : `<button class="gallery-btn" onclick="deleteItem(${i})">Delete</button>`}
      </div>
    `;
  });
  html += '</div>';
  container.innerHTML = html;
}

window.exportToGallery = () => {
  const image = canvas.toDataURL('image/png');
  const newItem = {
    name: 'Design ' + (gallery.length + 1),
    image: image,
    date: new Date().toLocaleDateString(),
    published: false
  };
  gallery.push(newItem);
  localStorage.setItem('atelierGallery', JSON.stringify(gallery));
  alert('Design added to Gallery!');
  switchTab('gallery');
}

window.deleteItem = (i) => {
  gallery.splice(i,1);
  localStorage.setItem('atelierGallery', JSON.stringify(gallery));
  switchTab('gallery');
}

window.publishItem = (i) => {
  gallery[i].published = true;
  localStorage.setItem('atelierGallery', JSON.stringify(gallery));
  alert('Published to Marketplace!');
}

window.addEventListener('resize', ()=>{camera.aspect=canvas.clientWidth/canvas.clientHeight;camera.updateProjectionMatrix();renderer.setSize(canvas.clientWidth,canvas.clientHeight)});

// LOAD DEFAULT TAB
switchTab('layers');
</script>
</body>
</html>
