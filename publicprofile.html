<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anna Creations - Creativity</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
  body{background:#0F0F0F;color:#F5F5F5;padding:20px}
  .nav{display:flex;gap:10px;background:#1A1A1A;padding:8px;border-radius:30px;width:fit-content;margin:0 auto 30px}
  .nav button{background:transparent;border:none;color:#A0A0A0;padding:8px 20px;border-radius:20px;cursor:pointer}
  .nav .active{background:#DDB892;color:#0F0F0F;font-weight:600}
  .profile-icon{position:absolute;top:20px;right:20px;width:40px;height:40px;border-radius:50%;background:#2a2a2a}
  .container{display:flex;gap:30px;max-width:1200px;margin:0 auto}
  
  .sidebar{width:280px}
  .profile-card{background:#1A1A1A;border-radius:16px;padding:20px;text-align:center}
  .avatar{width:70px;height:70px;border-radius:50%;background:#2a2a2a;margin:0 auto 10px}
  .name{font-weight:600;font-size:1.1rem}
  .bio{color:#A0A0A0;font-size:0.85rem;margin:5px 0 15px}
  .follow-btn{background:#DDB892;color:#0F0F0F;border:none;padding:8px 20px;border-radius:20px;font-weight:600;cursor:pointer;width:100%}
  
  .main{flex:1}
  h2{margin-bottom:20px;font-size:1.5rem}
  .grid{background:#1A1A1A;padding:20px;border-radius:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
  .grid-item{background:#222;border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:0.3s}
  .grid-item:hover{transform:scale(1.05);border:2px solid #DDB892}

  /* Public Modal - No Edit/Delete */
  .modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.85);display:none;align-items:center;justify-content:center;z-index:1000;backdrop-filter:blur(5px)}
  .modal-box{background:#fff;color:#0F0F0F;border-radius:20px;width:90%;max-width:800px;display:flex;gap:20px;padding:25px}
  .modal-left{flex:1;background:#F5F5F5;border-radius:12px;padding:20px;display:flex;align-items:center;justify-content:center}
  .modal-preview{width:100%;aspect-ratio:1;background:#0F0F0F;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:80px;color:#fff}
  .modal-right{flex:1;display:flex;flex-direction:column}
  .modal-author{font-weight:600;font-size:1.1rem;margin-bottom:8px}
  .modal-desc{color:#555;font-size:0.9rem;line-height:1.5;margin-bottom:15px}
  .modal-stats{display:flex;gap:20px;margin-bottom:15px}
  .stat{display:flex;align-items:center;gap:5px;cursor:pointer}
  .comments{flex:1;overflow-y:auto;margin-bottom:15px;font-size:0.85rem}
  .use-fabric-btn{background:#DDB892;color:#0F0F0F;border:none;padding:10px;width:100%;border-radius:8px;font-weight:600;cursor:pointer}
  .close-btn{position:absolute;top:20px;right:30px;background:none;border:none;color:#F5F5F5;font-size:30px;cursor:pointer}
</style>
</head>
<body>
  <div class="profile-icon"></div>
  <div class="nav">
    <button>Home</button><button class="active">Explore</button><button>Gallery</button><button>Marketplace</button>
  </div>

  <div class="container">
    <div class="sidebar">
      <div class="profile-card">
        <div class="avatar">👤</div>
        <div class="name">Anna Martina</div>
        <div class="bio">Fashion student • Toronto</div>
        <button class="follow-btn">Follow</button>
      </div>
    </div>

    <div class="main">
      <h2>Anna Creations</h2>
      <div class="grid" id="publicGrid"></div>
    </div>
  </div>

  <!-- Public Detail Modal -->
  <div class="modal-overlay" id="publicModal">
    <button class="close-btn" onclick="closeModal()">×</button>
    <div class="modal-box">
      <div class="modal-left">
        <div class="modal-preview">⛰️</div>
      </div>
      <div class="modal-right">
        <div class="modal-author">Anna Martina</div>
        <div class="modal-desc">
          Lorem Ipsum is standard placeholder text used in printing and typesetting. 
          Designers use it to focus on layout and design.
        </div>
        
        <div class="modal-stats">
          <div class="stat" onclick="like()">♡ <span id="likes">5</span></div>
          <div class="stat">💬 <span>2</span></div>
        </div>

        <div class="comments">
          <div><b>Grace Aiko</b> I like your design it really stood out for me</div>
          <div><b>Aron Biko</b> WOW WOW nice design</div>
        </div>

        <button class="use-fabric-btn" onclick="useFabric()">Use this Fabric in Workspace</button>
      </div>
    </div>
  </div>

<script>
  // Load 48 dummy items
  const grid = document.getElementById('publicGrid');
  for(let i=0; i<48; i++){
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.innerHTML = '⛰️';
    item.onclick = () => document.getElementById('publicModal').style.display='flex';
    grid.appendChild(item);
  }
  
  function closeModal(){document.getElementById('publicModal').style.display='none';}
  function like(){
    let l = document.getElementById('likes');
    l.innerText = parseInt(l.innerText) + 1;
  }
  function useFabric(){
    // Save this fabric ID to localStorage and open workspace
    localStorage.setItem('selectedFabric', 'fabricIdFromAnna');
    window.location.href = 'workspace.html';
    closeModal();
  }
</script>
</body>
</html>
